name: Build Paper and Forge

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      plugin_version: ${{ steps.version.outputs.plugin_version }}
      build_number: ${{ steps.version.outputs.build_number }}
      artifact_name: ${{ steps.version.outputs.artifact_name }}
      forge_artifact_name: ${{ steps.version.outputs.forge_artifact_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Calculate plugin version
        id: version
        shell: bash
        run: |
          BASE_VERSION="$(sed -n 's:.*<pluginBaseVersion>\(.*\)</pluginBaseVersion>.*:\1:p' pom.xml | head -n1)"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"
          if ! [[ "$MAJOR" =~ ^[0-9]+$ && "$MINOR" =~ ^[0-9]+$ && "$PATCH" =~ ^[0-9]+$ ]]; then
            echo "Invalid pluginBaseVersion '$BASE_VERSION'. Expected numeric major.minor.patch." >&2
            exit 1
          fi

          PATCH=$((PATCH + GITHUB_RUN_NUMBER))
          MINOR=$((MINOR + PATCH / 10))
          PATCH=$((PATCH % 10))
          MAJOR=$((MAJOR + MINOR / 10))
          MINOR=$((MINOR % 10))

          PLUGIN_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          ARTIFACT_NAME="WebhookIntegrations-Paper-${PLUGIN_VERSION}.jar"

          echo "plugin_version=${PLUGIN_VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_number=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"
          echo "forge_artifact_name=WebhookIntegrations-Forge-1.20.1-${PLUGIN_VERSION}.jar" >> "$GITHUB_OUTPUT"

      - name: Build plugin
        run: >
          mvn -B
          -Drevision=${{ steps.version.outputs.plugin_version }}
          -DpluginBuildNumber=${{ steps.version.outputs.build_number }}
          -DpluginRepository=${{ github.repository }}
          -DpluginRepositoryBranch=${{ github.event.repository.default_branch }}
          verify

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: target/${{ steps.version.outputs.artifact_name }}
          if-no-files-found: error
          retention-days: 14

      - name: Set up Java 17 for Forge 1.20.1
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test Forge mod
        working-directory: forge
        run: bash gradlew --no-daemon -PmodVersion=${{ steps.version.outputs.plugin_version }} build

      - name: Upload Forge artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.forge_artifact_name }}
          path: forge/build/libs/${{ steps.version.outputs.forge_artifact_name }}
          if-no-files-found: error
          retention-days: 14

      - name: Smoke test packaged Forge mod on a dedicated server
        shell: bash
        run: |
          SERVER_DIR="$RUNNER_TEMP/webhook-forge-smoke"
          mkdir -p "$SERVER_DIR/mods"
          curl --fail --location --retry 3 https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.0/forge-1.20.1-47.4.0-installer.jar -o "$RUNNER_TEMP/forge-installer.jar"
          java -jar "$RUNNER_TEMP/forge-installer.jar" --installServer "$SERVER_DIR" > "$RUNNER_TEMP/forge-install.log" 2>&1
          cp 'forge/build/libs/${{ steps.version.outputs.forge_artifact_name }}' "$SERVER_DIR/mods/"
          printf 'eula=true\n' > "$SERVER_DIR/eula.txt"
          printf 'server-ip=127.0.0.1\nserver-port=25579\nonline-mode=true\nlevel-type=minecraft:flat\ngenerate-structures=false\nview-distance=2\nsimulation-distance=2\n' > "$SERVER_DIR/server.properties"
          python3 forge/scripts/smoke_test.py --server-dir "$SERVER_DIR" --java "$JAVA_HOME/bin/java"

      - name: Upload Forge smoke logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: forge-smoke-logs
          path: |
            ${{ runner.temp }}/forge-install.log
            ${{ runner.temp }}/webhook-forge-smoke/smoke-test.log
            ${{ runner.temp }}/webhook-forge-smoke/logs/latest.log
          if-no-files-found: ignore

  release:
    if: github.actor != 'github-actions[bot]' && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download plugin artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: dist

      - name: Download Forge artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.forge_artifact_name }}
          path: dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.plugin_version }}
          name: WebhookIntegrations ${{ needs.build.outputs.plugin_version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body: |
            Choose the JAR for your server:
            - **Paper**: Paper 26.2, Java 25. Install in `plugins/`.
            - **Forge**: Minecraft 1.20.1, Forge 47.4.0+, Java 17. Install in `mods/`.

            Forge uses `config/webhookintegrations.json`. See [Forge setup and feature differences](https://github.com/${{ github.repository }}/blob/v${{ needs.build.outputs.plugin_version }}/docs/forge.md). PlaceholderAPI and the LightweightClans bridge are Paper-only.
          files: |
            dist/${{ needs.build.outputs.artifact_name }}
            dist/${{ needs.build.outputs.forge_artifact_name }}
          fail_on_unmatched_files: true
          overwrite_files: true

      - name: Update release metadata files
        shell: bash
        run: |
          printf '%s\n' '${{ needs.build.outputs.build_number }}' > buildnumber
          printf '%s\n' '${{ needs.build.outputs.artifact_name }}' > filename
          printf '%s\n' 'https://github.com/${{ github.repository }}/releases/download/v${{ needs.build.outputs.plugin_version }}/${{ needs.build.outputs.artifact_name }}' > downloadurl
          mkdir -p releases/paper releases/forge
          cp buildnumber filename downloadurl releases/paper/
          cp buildnumber releases/forge/buildnumber
          printf '%s\n' '${{ needs.build.outputs.forge_artifact_name }}' > releases/forge/filename
          printf '%s\n' 'https://github.com/${{ github.repository }}/releases/download/v${{ needs.build.outputs.plugin_version }}/${{ needs.build.outputs.forge_artifact_name }}' > releases/forge/downloadurl

      - name: Commit release metadata
        shell: bash
        run: |
          if git diff --quiet -- buildnumber filename downloadurl releases && [ -z "$(git ls-files --others --exclude-standard releases)" ]; then
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add buildnumber filename downloadurl releases
          git commit -m 'Update release metadata for ${{ needs.build.outputs.plugin_version }} [skip ci]'
          git push
